<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<title>CampaignForge Pro</title>
<meta name="description" content="Plan, publish and track every marketing campaign: AI plans shaped by your Company DNA and the moments your customers celebrate, ready-to-post content for ten channels, and budget tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--ground:#14161c;--ink:#eceef2;--muted:#a3a9b5;--line:#2a2e38;--accent:#f2a93b}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow-x:hidden}
#stage{max-width:1440px;margin:0 auto;background:var(--ground)}
#stage > :first-child{width:100% !important;height:auto !important;box-sizing:border-box}
#err{padding:40px 16px;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* App screens: tablet and phone layout */
@media (max-width:1199px){
  #stage .app{flex-direction:column}
  #stage .app > nav{width:100% !important;flex-direction:row !important;align-items:center;overflow-x:auto;padding:10px 12px !important;gap:4px !important;border-right:0 !important;border-bottom:1px solid #262a33;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  #stage .app > nav > div:first-child{padding:0 8px 0 2px !important;flex-shrink:0}
  #stage .app > nav > div:first-child .disp{display:none}
  #stage .app > nav .eyebrow, #stage .app > nav > div[style*="height: 1px"], #stage .app > nav > div[style*="flex-grow"]{display:none !important}
  #stage .app > nav .nav{white-space:nowrap;flex-shrink:0;min-height:40px}
  #stage .app > nav .num{display:none}
  #stage .app > nav > .panel{flex-shrink:0;white-space:nowrap;padding:6px 12px !important}
  #stage .app > nav > .panel br{display:none}
  #stage .app > main{padding:20px 16px 40px !important;min-width:0;flex-wrap:wrap}
  #stage .app main *{max-width:100%;min-width:0;box-sizing:border-box}
  #stage .app main > aside{width:100% !important}
  #stage .app .rg1{grid-template-columns:1fr !important}
  #stage .app .rg{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  #stage .app table{display:block;overflow-x:auto;white-space:nowrap}
  #stage .app .scrollx{overflow-x:auto}
  #stage .app .gantt{min-width:880px}
  #stage .app section:has(> .gantt){overflow-x:auto}
  #stage .app header{flex-wrap:wrap;gap:12px}
  #stage .app .paper{padding:24px 20px !important}
}
@media (max-width:699px){
  #stage .app .rg{grid-template-columns:1fr !important}
  #stage .app .rg4{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  #stage .app main [style*="display: flex"]{flex-wrap:wrap}
  #stage .app h1{font-size:26px !important}
  #stage .app main .disp[style*="font-size: 30px"], #stage .app main .disp[style*="font-size: 26px"]{font-size:22px !important}
}
/* Voice-guided tour */
.tour-hl{outline:3px solid #f2a93b !important;outline-offset:4px;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,9,12,.55) !important;position:relative;z-index:40;transition:outline-color .2s}
#tour{position:fixed;z-index:60;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:380px;max-width:calc(100vw - 32px);background:#1b1e26;border:1px solid #3a3f4c;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.5);padding:18px;color:#eceef2;font-family:'DM Sans',system-ui,sans-serif}
#tour[hidden]{display:none}
#tour .t-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#tour .t-dot{width:10px;height:10px;border-radius:50%;background:#5ee0c9;flex-shrink:0}
#tour .t-dot.talk{animation:tpulse 1s ease-in-out infinite}
@keyframes tpulse{50%{opacity:.3;transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){#tour .t-dot.talk{animation:none}}
#tour .t-step{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#a3a9b5}
#tour .t-title{font:600 17px 'Space Grotesk',sans-serif;margin:0 0 6px}
#tour .t-text{font-size:14px;line-height:1.55;color:#dfe2e8;margin:0;max-height:34vh;overflow:auto}
#tour .t-bar{height:4px;border-radius:2px;background:#2a2e38;margin:12px 0}
#tour .t-bar div{height:4px;border-radius:2px;background:#f2a93b;transition:width .3s}
#tour .t-ctl{display:flex;gap:6px;flex-wrap:wrap}
#tour button{min-height:40px;padding:0 12px;border-radius:8px;border:1px solid #343945;background:#1f232c;color:#eceef2;font:600 13px 'DM Sans',sans-serif;cursor:pointer}
#tour button.pri{background:#f2a93b;border-color:#f2a93b;color:#1a1305;margin-left:auto}
#tour .t-x{margin-left:auto;min-height:32px;padding:0 10px;background:transparent;border:0;color:#a3a9b5}
#tour-launch{position:fixed;z-index:55;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #f2a93b;background:#221b10;color:#f2a93b;font:600 14px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#tour-launch[hidden]{display:none}
@media (max-width:699px){#tour{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;padding:14px}#tour .t-text{max-height:24vh}}
</style>

<script>

(0,1fr));gap:5px}\n.cal span{height:30px;border-radius:5px;background:#171a21;border:1px solid #262a33}\n.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\n.stat div{background:#14161c;border:1px solid #2a2e38;border-radius:10px;padding:12px}\n.k{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#a3a9b5}\n.v{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;margin-top:4px}\nsection.block{padding-block:56px;border-top:1px solid #23262f}\n.block h2{font-family:'Space Grotesk',sans-serif;font-size:34px;margin:10px 0 28px;font-weight:600;text-wrap:balance}\n.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}\n.feat{padding:22px}\n.feat h3{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:12px 0 8px;font-weight:600}\n.feat p{margin:0;color:#b4b9c4;font-size:14px;line-height:1.6}\n.ic{width:40px;height:40px;border-radius:10px;background:#2e2514;display:flex;align-items:center;justify-content:center;color:#f2a93b}\n.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;counter-reset:s}\n.step{padding:22px}\n.step .n{font-family:'JetBrains Mono',monospace;color:#5ee0c9;font-size:13px}\n.step h3{font-family:'Space Grotesk',sans-serif;font-size:17px;margin:10px 0 6px;font-weight:600}\n.step p{margin:0;color:#b4b9c4;font-size:14px;line-height:1.55}\n.chips{display:flex;flex-wrap:wrap;gap:10px}\n.chip{padding:8px 14px;border-radius:999px;border:1px solid #343945;font-size:14px;color:#dfe2e8}\n.band{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:32px}\n.band h2{margin:0;font-size:28px}\nfooter{padding-block:28px;color:#8b91a0;font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid #23262f}\n@media (max-width:980px){\n.hero{grid-template-columns:1fr;padding-block:32px 48px}\n.hero h1{font-size:40px}\n.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}\n.steps{grid-template-columns:repeat(2,minmax(0,1fr))}\n}\n@media (max-width:620px){\n.wrap{padding-inline:16px}\n.hero h1{font-size:32px}\n.hero p{font-size:16px}\n.grid3,.steps{grid-template-columns:1fr}\n.links a.plain{display:none}\n.block h2{font-size:26px}\n.stat .v{font-size:18px}\n}\n", "html": "<div style=\"width: 1440px; min-height: 2300px; background: #14161c\">\n<div class=\"wrap\">\n<header class=\"top\">\n<a class=\"logo\" href=\"Home.dc.html\"><span class=\"mark\">CF<\/span><span class=\"disp\" style=\"font-size: 18px; font-weight: 600\">CampaignForge <span style=\"color: #f2a93b\">Pro<\/span><\/span><\/a>\n<nav class=\"links\" aria-label=\"Main\">\n<a class=\"plain\" href=\"#features\">Features<\/a>\n<a class=\"plain\" href=\"#how\">How it works<\/a>\n<a class=\"plain\" href=\"#channels\">Channels<\/a>\n<template data-sc-if value=\"{{signedIn}}\" hint-placeholder-val=\"{{false}}\"><a class=\"btn pri\" href=\"Main.dc.html\">Open the app<\/a><\/template>\n<template data-sc-if value=\"{{signedOut}}\" hint-placeholder-val=\"{{true}}\"><a class=\"plain\" href=\"Auth.dc.html\" style=\"display: inline\">Sign in<\/a><a class=\"btn pri\" href=\"Auth.dc.html\">Get started<\/a><\/template>\n<\/nav>\n<\/header>\n<section class=\"hero\">\n<div>\n<div class=\"eyebrow\">Campaign planning and tracking<\/div>\n<h1>Plan every campaign. Publish on every channel. Account for every rupee.<\/h1>\n<p>Write a short brief and get a dated plan shaped by your Company DNA and the festivals your customers celebrate. Then produce ready-to-post content for ten channels and track budget and returns across every campaign you run.<\/p>\n<div class=\"ctas\">\n<a class=\"btn pri\" href=\"Auth.dc.html\">Create your account<\/a>\n<button class=\"btn\" type=\"button\" onClick=\"{{demo}}\">Take the guided demo<\/button>\n<\/div>\n<p style=\"font-size: 13px; color: #8b91a0; margin: 16px 0 0\">The demo opens with a voice guide that walks you through a sample campaign, step by step. Turn your sound on.<\/p>\n<\/div>\n<div class=\"panel preview\" aria-hidden=\"true\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\"><span class=\"disp\" style=\"font-weight: 600\">Diwali Festive Push<\/span><span class=\"mono\" style=\"font-size: 11px; color: #5ee0c9\">PLAN BUILT<\/span><\/div>\n<div class=\"cal\">\n<span><\/span><span style=\"background: #7a2748\"><\/span><span><\/span><span style=\"background: #1f4b7a\"><\/span><span><\/span><span style=\"background: #7a2748\"><\/span><span style=\"background: #132724; border-color: #2a5a52\"><\/span>\n<span style=\"background: #7a4a1c\"><\/span><span><\/span><span style=\"background: #7a2748\"><\/span><span style=\"background: #17564d\"><\/span><span><\/span><span style=\"background: #1f4b7a\"><\/span><span><\/span>\n<span><\/span><span style=\"background: #7a2748\"><\/span><span><\/span><span style=\"background: #7a4a1c\"><\/span><span style=\"background: #1f4b7a\"><\/span><span><\/span><span style=\"background: #7a2748\"><\/span>\n<\/div>\n<div class=\"stat\">\n<div><div class=\"k\">Readiness<\/div><div class=\"v\" style=\"color: #5ee0c9\">90<\/div><\/div>\n<div><div class=\"k\">Budget used<\/div><div class=\"v\">70%<\/div><\/div>\n<div><div class=\"k\">Next moment<\/div><div class=\"v\" style=\"font-size: 16px\">Diwali<\/div><\/div>\n<\/div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px\"><span class=\"chip\" style=\"font-size: 12px; padding: 4px 10px\">Instagram reel<\/span><span class=\"chip\" style=\"font-size: 12px; padding: 4px 10px\">YouTube video<\/span><span class=\"chip\" style=\"font-size: 12px; padding: 4px 10px\">LinkedIn post<\/span><span class=\"chip\" style=\"font-size: 12px; padding: 4px 10px\">Email<\/span><\/div>\n<\/div>\n<\/section>\n<section class=\"block\" id=\"features\">\n<div class=\"eyebrow\">What you get<\/div>\n<h2>Everything between the brief and the results<\/h2>\n<div class=\"grid3\">\n<div class=\"panel feat\"><div class=\"ic\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M7 4c0 6 10 10 10 16M17 4c0 6-10 10-10 16M8 8h8M8 16h8\"><\/path><\/svg><\/div><h3>Company DNA<\/h3><p>Voice, signature phrases, banned words and approved facts, saved once and applied to every plan, post and video.<\/p><\/div>\n<div class=\"panel feat\"><div class=\"ic\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><path d=\"M3 10h18M8 3v4M16 3v4\"><\/path><\/svg><\/div><h3>Moments calendar<\/h3><p>Festivals, holidays and sale days for India, its states and your international markets, timed with the right lead.<\/p><\/div>\n<div class=\"panel feat\"><div class=\"ic\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z\"><\/path><\/svg><\/div><h3>Plan and refine with AI<\/h3><p>A dated plan from one brief. Refine the whole plan, a week or a single post in plain words.<\/p><\/div>\n<div class=\"panel feat\"><div class=\"ic\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8\"><\/circle><path d=\"M12 8v4l3 2\"><\/path><\/svg><\/div><h3>Readiness score<\/h3><p>A visible rubric scores each plan out of 100 and suggests quick fixes before anything goes live.<\/p><\/div>\n<div class=\"panel feat\"><div class=\"ic\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M4 12l16-8-6 16-3-7z\"><\/path><\/svg><\/div><h3>Publish hub<\/h3><p>Every approved post in the exact size and length each channel needs, auto-posted or exported as a ready folder.<\/p><\/div>\n<div class=\"panel feat\"><div class=\"ic\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"><\/path><\/svg><\/div><h3>Budget and campaign tracking<\/h3><p>Split budget by channel and week, watch spend and returns, and see every campaign's health, timeline and risks.<\/p><\/div>\n<\/div>\n<\/section>\n<section class=\"block\" id=\"how\">\n<div class=\"eyebrow\">How it works<\/div>\n<h2>From brief to published in four steps<\/h2>\n<div class=\"steps\">\n<div class=\"panel step\"><div class=\"n\">Step 1<\/div><h3>Set up Company DNA<\/h3><p>Add your voice, facts and markets once.<\/p><\/div>\n<div class=\"panel step\"><div class=\"n\">Step 2<\/div><h3>Write a short brief<\/h3><p>Goal, audience, channels and dates. Type it or dictate it.<\/p><\/div>\n<div class=\"panel step\"><div class=\"n\">Step 3<\/div><h3>Review and approve<\/h3><p>Check the readiness score, refine with AI and send posts to reviewers.<\/p><\/div>\n<div class=\"panel step\"><div class=\"n\">Step 4<\/div><h3>Publish and track<\/h3><p>Post or export for each channel, then follow spend and returns.<\/p><\/div>\n<\/div>\n<\/section>\n<section class=\"block\" id=\"channels\">\n<div class=\"eyebrow\">Channels<\/div>\n<h2>Ready-to-post content for ten channels<\/h2>\n<div class=\"chips\"><span class=\"chip\">Instagram<\/span><span class=\"chip\">Facebook<\/span><span class=\"chip\">YouTube<\/span><span class=\"chip\">X<\/span><span class=\"chip\">LinkedIn<\/span><span class=\"chip\">TikTok<\/span><span class=\"chip\">Blog<\/span><span class=\"chip\">Google Ads<\/span><span class=\"chip\">Email<\/span><span class=\"chip\">WhatsApp<\/span><\/div>\n<\/section>\n<section class=\"block\">\n<div class=\"panel band\">\n<h2 class=\"disp\">Start planning your next campaign<\/h2>\n<div class=\"ctas\"><a class=\"btn pri\" href=\"Auth.dc.html\">Create your account<\/a><button class=\"btn\" type=\"button\" onClick=\"{{demo}}\">Take the guided demo<\/button><\/div>\n<\/div>\n<\/section>\n<footer><span>CampaignForge Pro · prototype with sample data<\/span><span>© 2026 CampaignForge<\/span><\/footer>\n<\/div>\n<\/div>", "title": "Welcome"}, "Auth": {"css": "\nbody{margin:0;background:#14161c;color:#eceef2;font-family:'DM Sans',system-ui,sans-serif}\na{color:#f2a93b}a:hover{color:#ffc46b}\n.disp{font-family:'Space Grotesk',sans-serif}\n.shell{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:900px}\n.side{background:#101218;border-right:1px solid #262a33;padding:40px 56px;display:flex;flex-direction:column;gap:28px}\n.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#eceef2}\n.mark{width:32px;height:32px;border-radius:8px;background:#f2a93b;display:flex;align-items:center;justify-content:center;color:#1a1305;font:700 15px 'Space Grotesk',sans-serif}\n.side h2{font-family:'Space Grotesk',sans-serif;font-size:34px;line-height:1.15;margin:0;font-weight:600;text-wrap:balance}\n.side ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px}\n.side li{display:flex;gap:12px;font-size:15px;line-height:1.5;color:#c3c8d2}\n.tick{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#123a33;color:#5ee0c9;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}\n.formside{display:flex;align-items:center;justify-content:center;padding:40px 24px}\n.card{width:100%;max-width:400px}\n.card h1{font-family:'Space Grotesk',sans-serif;font-size:32px;margin:0 0 6px;font-weight:600}\n.sub{margin:0 0 24px;color:#b4b9c4;font-size:14px}\n.panel{background:#1b1e26;border:1px solid #2a2e38;border-radius:14px;padding:24px}\nform{display:flex;flex-direction:column;gap:16px}\nlabel{display eel voiceover<\/span><span class=\"chip n\">Readiness fixes<\/span><\/div>\n<\/section>\n<\/aside>\n<\/div>\n<\/main>\n<\/div>", "title": "Company DNA"}, "Dates": {"css": "\nbody{margin:0;background:#14161c;color:#eceef2;font-family:'DM Sans',system-ui,sans-serif}\na{color:#f2a93b}a:hover{color:#ffc46b}\n.nav{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:8px;color:#b4b9c4;text-decoration:none;font-size:14px}\n.nav:hover{background:#1b1e26;color:#eceef2}\n.nav.on{background:#2e2514;color:#f2a93b;font-weight:600}\n.num{font-family:'JetBrains Mono',monospace;font-size:11px;color:#7d8391;width:18px}\n.panel{background:#1b1e26;border:1px solid #2a2e38;border-radius:12px}\n.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#a3a9b5}\n.disp{font-family:'Space Grotesk',sans-serif}\n.mono{font-family:'JetBrains Mono',monospace}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;font-weight:600;font-size:14px;font-family:inherit;border:1px solid #343945;background:#1f232c;color:#eceef2;cursor:pointer;text-decoration:none}\n.btn.pri{background:#f2a93b;border-color:#f2a93b;color:#1a1305}\n.pill{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #343945;background:transparent;color:#c3c8d2;font-weight:500;font-size:13px;font-family:inherit;cursor:pointer}\n.pill.on{background:#eceef2;color:#14161c;border-color:#eceef2;font-weight:600}\n.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}\n.hi{background:#123a33;color:#5ee0c9}.md{background:#3d2f12;color:#f7be5f}.lo{background:#262a33;color:#c3c8d2}\n.th{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#a3a9b5;text-align:left;padding:9px 10px;border-bottom:1px solid #2a2e38;font-weight:500}\n.td{pa iv>\n<a class=\"nav\" href=\"Budget.dc.html\"><span class=\"num\">07<\/span>Budget &amp; ROI<\/a>\n<a class=\"nav\" href=\"Timeline.dc.html\"><span class=\"num\">08<\/span>Timeline &amp; tasks<\/a>\n<a class=\"nav\" href=\"Prioritise.dc.html\"><span class=\"num\">09<\/span>Prioritise &amp; risks<\/a>\n<a class=\"nav\" href=\"Report.dc.html\"><span class=\"num\">10<\/span>Exec report<\/a>\n<div style=\"flex-grow: 1\"><\/div>\n<div class=\"panel\" style=\"padding: 14px; font-size: 13px; color: #b4b9c4\"><span style=\"color: #eceef2; font-weight: 600\">{{$userName}}<\/span><br>Brand: Kesar &amp; Co. (sample)<br><a href=\"Signout.dc.html\">Sign out<\/a><\/div>\n<\/nav>\n<main style=\"flex-grow: 1; padding: 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px\">\n<header style=\"display: flex; align-items: flex-end; justify-content: space-between\">\n<div>\n<div class=\"eyebrow\">Festivals, holidays and shopping days · every year, every market · Sample view<\/div>\n<h1 class=\"disp\" style=\"margin: 6px 0 0; font-size: 32px; font-weight: 600\">Moments calendar<\/h1>\n<p style=\"margin: 6px 0 0; color: #b4b9c4; font-size: 15px\">Pick your target markets once. Every new plan is built around their festivals and holidays, with posts timed before each date.<\/p>\n<\/div>\n<div style=\"display: flex; gap: 10px\">\n<button class=\"btn\" type=\"button\">Import .ics<\/button>\n<button class=\"btn\" type=\"button\">+ Add your own date<\/button>\n<button class=\"btn pri\" type=\"button\">Save markets<\/button>\n<\/div>\n<\/header>\n<section class=\"panel\" style=\"padding: 16px 18px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; gap: 12px; align-items: center; flex-wrap: wrap\"><span class=\"eyebrow\" style=\"width: 110px\">Target markets<\/span><template data-sc-for list=\"{{markets}}\" as=\"m\" hint-placeholder-count=\"8\"><button type=\"button\" class=\"{{m.cls}}\" onClick=\"{{m.pick}}\" aria-pressed=\"{{m.on}}\">{{m.label}}<\/button><\/template><button type=\"button\" class=\"pill\">+ Add country or state<\/button><\/div>\n<div style=\"display: flex; gap: 12px; align-items: center; flex-wrap: wrap\"><span class=\"eyebrow\" style=\"width: 110px\">Date types<\/span><span class=\"pill on\" style=\"display: inline-flex; align-items: center\">National holidays<\/span><span class=\"pill on\" style=\"display: inline-flex; align-items: center\">Religious festivals<\/span><span class=\"pill on\" style=\"display: inline-flex; align-items: center\">Regional festivals<\/span><span class=\"pill on\" style=\"display: inline-flex; align-items: center\">Shopping events<\/span><span class=\"pill\" style=\"display: inline-flex; align-items: center\">Awareness days<\/span><span class=\"pill\" style=\"display: inline-flex; align-items: center\">Sports &amp; cricket<\/span><span class=\"pill on\" style=\"display: inline-flex; align-items: center\">Your dates<\/span><\/div>\n<\/section>\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; flex-grow: 1\">\n<section class=\"panel\" style=\"padding: 6px 8px 8px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; margin: 12px 10px 6px\"><h2 class=\"disp\" style=\"margin: 0; font-size: 18px; font-weight: 600\">Oct 2026 – Jan 2027 · {{count}} dates<\/h2><div style=\"display: flex; gap: 6px\"><span class=\"pill\" style=\"display: inline-flex; align-items: center\">Year<\/span><span class=\"pill on\" style=\"display: inline-flex; align-items: center\">Quarter<\/span><span class=\"pill\" style=\"display: inline-flex; align-items: center\">Month<\/span><\/div><\/div>\n<table style=\"width: 100%; border-collapse: collapse\">\n<thead><tr><th class=\"th\">Date<\/th><th class=\"th\">Occasion<\/th><th class=\"th\">Market<\/th><th class=\"th\">Type<\/th><th class=\"th\">Fit for your brand<\/th><th class=\"th\">Start posting<\/th><th class=\"th\"><\/th><\/tr><\/thead>\n<tbody>\n<template data-sc-fo ext year’s dates load automatically.<\/p>\n<\/div>\n<\/aside>\n<\/div>\n<\/main>\n<\/div>", "title": "Moments calendar"}, "New": {"css": "\nbody{margin:0;background:#14161c;color:#eceef2;font-family:'DM Sans',system-ui,sans-serif}\na{color:#f2a93b}a:hover{color:#ffc46b}\n.nav{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:8px;color:#b4b9c4;text-decoration:none;font-size:14px}\n.nav:hover{background:#1b1e26;color:#eceef2}\n.nav.on{background:#2e2514;color:#f2a93b;font-weight:600}\n.num{font-family:'JetBrains Mono',monospace;font-size:11px;color:#7d8391;width:18px}\n.panel{background:#1b1e26;border:1px solid #2a2e38;border-radius:12px}\n.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#a3a9b5}\n.disp{font-family:'Space Grotesk',sans-serif}\n.mono{font-family:'JetBrains Mono',monospace}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;font:600 14px 'DM Sans',sans-serif;border:1px solid #343945;background:#1f232c;color:#eceef2;cursor:pointer;text-decoration:none}\n.btn.pri{background:#f2a93b;border-color:#f2a93b;color:#1a1305}\n.btn.ai{background:#15302c;border-color:#2a5a52;color:#5ee0c9}\n.pill{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid #343945;background:transparent;color:#c3c8d2;font:500 14px 'DM Sans',sans-serif;cursor:pointer}\n.pill.on{background:#eceef2;color:#14161c;border-color:#eceef2;font-weight:600}\n.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:8px}\n.fld{width:100%;box-sizing:border-box;background:#14161c;border:1px solid #343945;border-radius:10px;color:#eceef2;font:14px/1.5 'DM Sans',sans-serif;padding:11px 14px;resize:none}\n.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}\n.g{background:#123a33;color:#5ee0c9}.n{background:#262a33;color:#c3c8d2}\n", "html": "<d : space-between\">\n<div>\n<div class=\"eyebrow\">Diwali Festive Push · creative brief 1 of 3 · Sample data<\/div>\n<h1 class=\"disp\" style=\"margin: 6px 0 0; font-size: 30px; font-weight: 600\">Diwali gift box: hero banner and reel<\/h1>\n<\/div>\n<div style=\"display: flex; gap: 8px; align-items: center\">\n<span class=\"chip a\">In review<\/span>\n<button class=\"icon\" type=\"button\" aria-label=\"Duplicate brief\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2\"><\/rect><path d=\"M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3\"><\/path><\/svg><\/button>\n<button class=\"icon\" type=\"button\" aria-label=\"Regenerate brief\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M20 11a8 8 0 0 0-14.9-3M4 5v4h4M4 13a8 8 0 0 0 14.9 3M20 19v-4h-4\"><\/path><\/svg><\/button>\n<button class=\"icon\" type=\"button\" aria-label=\"Delete brief\" style=\"color: #ff8a8e\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13\"><\/path><\/svg><\/button>\n<\/div>\n<\/header>\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; flex-grow: 1\">\n<section class=\"panel\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 14px\">\n<div><label class=\"lbl\" for=\"obj\">Objective<\/label><textarea id=\"obj\" class=\"fld\" rows=\"2\">Drive Diwali pre-orders for 500 g and 1 kg gift boxes before 5 Nov.<\/textarea><\/div>\n<div><label class=\"lbl\" for=\"msg\">Key message<\/label><textarea id=\"msg\" class=\"fld\" rows=\"2\">Handmade at 5 am, on your table by Diwali. Share the sweetness.<\/textarea><\/div>\n<div><labe  column; gap: 16px\">\n<header style=\"display: flex; align-items: flex-end; justify-content: space-between\">\n<div>\n<div class=\"eyebrow\">Auto-built from live campaign data · Sample data<\/div>\n<h1 class=\"disp\" style=\"margin: 6px 0 0; font-size: 30px; font-weight: 600\">Executive status report<\/h1>\n<\/div>\n<div style=\"display: flex; gap: 10px\">\n<button class=\"btn\" type=\"button\">Rewrite summary with AI<\/button>\n<button class=\"btn\" type=\"button\">Share link<\/button>\n<button class=\"btn pri\" type=\"button\">Export PDF / PPTX<\/button>\n<\/div>\n<\/header>\n<article class=\"paper\" style=\"flex-grow: 1; display: flex; flex-direction: column; gap: 22px\">\n<div style=\"display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #1c1d21; padding-bottom: 14px\">\n<div><div class=\"ph\" style=\"margin: 0\">All campaigns · week of 28 Sep 2026<\/div><h2 class=\"disp\" style=\"margin: 6px 0 0; font-size: 28px; font-weight: 600\">Q4 campaign status<\/h2><\/div>\n<div style=\"font-size: 13px; color: #6b6f78; text-align: right\">Prepared for: Leadership review<br>Owner: Marketing team<\/div>\n<\/div>\n<section>\n<p class=\"ph\">Executive summary<\/p>\n<ul style=\"margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.65\">\n<li>6 campaigns active against a ₹48.0 L budget; ₹21.6 L (45%) spent. Forecast revenue ₹1.62 Cr, a 3.4× return on budget.<\/li>\n<li>Diwali Festive Push is amber: forecast ₹1.2 L over budget. A ₹0.8 L move from outdoor to Meta ads is awaiting approval.<\/li>\n<li>Monsoon Re-engagement is red on cost per lead; new audiences are in test, with a decision at the 3 Oct review.<\/li>\n<li>Diwali plan quality score is 78 / 100 against a launch threshold of 85; three fixes are queued.<\/li>\n<\/ul>\n<\/section>\n<div style=\"display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px\">\n<section>\n<p class=\"ph\">Campaign health<\/p>\n<table class=\"t\" style=\"width: 100%; bor { name: 'B2B case-study series', r: 1500, i: 2, c: 0.8, e: 1, bv: 3, tc: 2, rr: 3, js: 2 }
];
var rice = this.state.fw === 'rice';
var scored = ideas.map(function (x) {
var s = rice ? Math.round(x.r * x.i * x.c / x.e) : Math.round((x.bv + x.tc + x.rr) / x.js * 10) / 10;
var vals = rice ? [x.r.toLocaleString('en-IN'), x.i, Math.round(x.c * 100) + '%', x.e] : [x.bv, x.tc, x.rr, x.js];
return { name: x.name, vals: vals, s: s };
}).sort(function (a, b) { return b.s - a.s; });
var rows = scored.map(function (x, i) { return { rank: i + 1, name: x.name, vals: x.vals, score: rice ? x.s.toLocaleString('en-IN') : x.s }; });
var fw = [['rice', 'RICE'], ['wsjf', 'WSJF']].map(function (f) {
return { label: f[1], cls: self.state.fw === f[0] ? 'btn sel' : 'btn', pick: function () { self.setState({ fw: f[0] }); } };
});
var L = [['Ananya R.', [90, 110, 120, 115, 100, 95]], ['Meera P.', [70, 85, 90, 80, 75, 60]], ['Karthik S.', [60, 80, 85, 90, 70, 50]], ['Rohan D.', [100, 95, 60, 50, 40, 40]]];
var load = L.map(function (p) {
return { name: p[0], cells: p[1].map(function (v) {
var bg = v > 100 ? '#44191b' : v >= 85 ? '#3d2f12' : '#123a33';
var fg = v > 100 ? '#ff8a8e' : v >= 85 ? '#f7be5f' : '#5ee0c9';
return { v: v, style: 'background: ' + bg + '; color: ' + fg };
}) };
});
return {
fw: fw, rows: rows, load: load,
fwName: rice ? 'RICE' : 'WSJF',
cols: rice ? ['Reach', 'Impact', 'Confidence', 'Effort'] : ['Business value', 'Time criticality', 'Risk reduction', 'Job size'],
formula: rice ? 'RICE = Reach × Impact × Confidence ÷ Effort. Reach = customers in the quarter; Impact 0.25–3; Effort in person-months.' : 'WSJF = (Business value + Time criticality + Risk reduction) ÷ Job size, each on a 1–10 scale.'
};
}
}
return Component;
})();
DC["Report"] = (function () {
class Component extends DCLogic {
renderVals() { return {}; }
}
return Component;
})();
</script>
<script>
var App = (function () {
  var stage = document.getElementById('stage');
  var cssEl = document.getElementById('screen-css');
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  var SVG = 'http://www.w3.org/2000/svg';
  var PUBLIC = { Home: 1, Auth: 1 };
  var parsed = {}, current = null, inst = null, pending = false;

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope[parts[0]];
    for (var i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
    return v;
  }
  function show(v) { return v == null || v === false ? '' : String(v); }
  function interp(s, scope) { return s.replace(HOLE, function (m, p) { return show(lookup(p, scope)); }); }

  function render(nodes, scope, out) {
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.nodeType === 3) { out.appendChild(document.createTextNode(interp(n.nodeValue, scope))); continue; }
      if (n.nodeType !== 1) continue;
      if (n.tagName === 'TEMPLATE' && n.hasAttribute('data-sc-for')) {
        var m = WHOLE.exec(n.getAttribute('list') || ''), list = m ? lookup(m[1], scope) : null;
        var as = n.getAttribute('as') || 'item';
        (list || []).forEach(function (item, idx) {
          var s = Object.create(scope); s[as] = item; s.$index = idx;
          render(n.content.childNodes, s, out);
        });
        continue;
      }
      if (n.tagName === 'TEMPLATE' && n.hasAttribute('data-sc-if')) {
        var c = WHOLE.exec(n.getAttribute('value') || '');
        if (c && lookup(c[1], scope)) render(n.content.childNodes, scope, out);
        continue;
      }
      var el = n.namespaceURI === SVG ? document.createElementNS(SVG, n.localName) : document.createElement(n.localName);
      for (var a = 0; a < n.attributes.length; a++) {
        var name = n.attributes[a].name, val = n.attributes[a].value;
        if (name.indexOf('hint-') === 0) continue;
        var w = WHOLE.exec(val);
        if (name.indexOf('on') === 0 && w) {
          var fn = lookup(w[1], scope);
          if (typeof fn === 'function') el.addEventListener(name.slice(2), fn);
          continue;
        }
        el.setAttribute(name, interp(val, scope));
      }
      render((n.content || n).childNodes, scope, el);
      if (el.tagName === 'TEXTAREA') el.value = el.textContent;
      out.appendChild(el);
    }
  }

  function template(name) {
    if (!parsed[name]) {
      var doc = new DOMParser().parseFromString('<body>' + SCREENS[name].html + '</body>', 'text/html');
      parsed[name] = doc.body;
    }
    return parsed[name];
  }

  /* Tag layout grids so the responsive CSS can restack them without touching row-level grids. */
  function tagGrids(root) {
    var els = root.querySelectorAll('[style*="grid-template-columns"]');
    for (var i = 0; i < els.length; i++) {
      var t = els[i].style.gridTemplateColumns || '';
      var rep = /repeat\((\d+)/.exec(t), count = rep ? +rep[1] : 0;
      if (count >= 7) { if (count > 7 && els[i].parentElement) els[i].parentElement.classList.add('scrollx'); continue; }
      var px = (t.match(/(\d+)px/g) || []).map(function (s) { return parseInt(s, 10); }).filter(function (p) { return p > 0; });
      var big = px.some(function (p) { return p >= 240; });
      if (big) els[i].classList.add('rg1');
      else if (!px.length) { els[i].classList.add('rg'); if ((count || (t.match(/fr/g) || []).length) >= 4) els[i].classList.add('rg4'); }
    }
  }

  function paint() {
    pending = false;
    if (!inst) return;
    var y = window.scrollY;
    var user = CFP.user();
    var base = { $userName: user ? user.name : 'Guest', $user: user || {} };
    var scope = Object.assign(Object.create(base), inst.renderVals() || {});
    var frag = document.createDocumentFragment();
    render(template(current).childNodes, scope, frag);
    stage.replaceChildren(frag);
    var root = stage.firstElementChild;
    if (root) {
      root.style.minHeight = window.innerHeight + 'px';
      if (root.querySelector(':scope > nav')) root.classList.add('app');
      tagGrids(root);
    }
    window.scrollTo(0, y);
    if (window.Tour) Tour.onPaint();
  }

  function go(name, push) {
    if (name === 'Signout') { CFP.signOut(); name = 'Home'; push = true; }
    if (!SCREENS[name]) name = 'Home';
    if (!PUBLIC[name] && !CFP.user()) name = 'Auth';
    if (name === 'Auth' && CFP.user()) name = 'Main';
    if (inst && inst.componentWillUnmount) inst.componentWillUnmount();
    current = name;
    cssEl.textContent = SCREENS[name].css;
    document.title = name === 'Home' ? 'CampaignForge Pro' : SCREENS[name].title + ' · CampaignForge Pro';
    inst = new DC[name]({});
    if (push && location.hash !== '#' + name) {
      try { history.pushState(null, '', '#' + name); } catch (e) { location.hash = name; }
    } else if (location.hash && location.hash !== '#' + name) {
      try { history.replaceState(null, '', '#' + name); } catch (e) {}
    }
    paint();
    window.scrollTo(0, 0);
    if (inst.componentDidMount) inst.componentDidMount();
    if (window.CFP_TOUR_PENDING && window.Tour && name !== 'Home' && name !== 'Auth') { window.CFP_TOUR_PENDING = false; setTimeout(function () { Tour.start(); }, 300); }
  }

  stage.addEventListener('click', function (e) {
    var tb = e.target.closest('button');
    if (tb && /Explore demo campaign/.test(tb.textContent) && window.Tour) { Tour.start(); return; }
    var a = e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href');
    var m = /^\/?([A-Za-z0-9_-]+)\.dc\.html$/.exec(href);
    if (m) { e.preventDefault(); go(m[1], true); return; }
    if (href.charAt(0) === '#' && href.length > 1) {
      var target = document.getElementById(href.slice(1));
      if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }
  });
  window.addEventListener('popstate', function () { go(location.hash.slice(1) || 'Home', false); });
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (h && h !== current && (SCREENS[h] || h === 'Signout')) go(h, false); });

  return {
    current: function () { return current; },
    open: function (name) { go(name, true); },
    schedule: function () { if (!pending) { pending = true; requestAnimationFrame(paint); } },
    start: function () {
      try { go(location.hash.slice(1) || 'Home', false); }
      catch (err) { stage.innerHTML = '<p id="err">This page could not load. Reload to try again.</p>'; console.error(err); }
    }
  };
})();
</script>
<script>
/* Voice-guided walkthrough of the sample campaign. Uses the browser's built-in speech; captions always shown. */
var Tour = (function () {
  var STEPS = [
    { s: 'Main', find: ['Campaign dashboard', 'header'], title: 'Welcome',
      say: 'Welcome to CampaignForge Pro. I will walk you through a sample campaign for a sweet shop called Kesar and Company, getting ready for Diwali. You can pause, go back, or mute me at any time.' },
    { s: 'Main', find: ['Active campaigns', 'section'], title: 'Your dashboard',
      say: 'This is your campaign dashboard. These tiles show how many campaigns are running, the total budget, how much has been spent, and the revenue you expect.' },
    { s: 'Main', find: ['Pacing alert', 'section'], title: 'Early warnings',
      say: 'When a campaign is spending faster than planned, an alert like this appears, so you can fix it before the money runs out.' },
    { s: 'Brand', find: ['Brand voice', 'section'], title: 'Company DNA',
      say: 'Before planning anything, you describe your brand once here: how you sound, words to use, words to avoid, and the facts the AI is allowed to use. Every plan and post follows these rules.' },
    { s: 'Dates', find: ['Target markets', 'section'], title: 'Moments calendar',
      say: 'Pick the markets you sell in. The app then lists festivals, holidays and sale days for those markets, and tells you how early to start posting for each one.' },
    { s: 'New', find: ['Choose a campaign type', 'div'], title: 'Start a campaign',
      say: 'To start a campaign, choose a type such as lead generation or product launch, and write a short brief about your business, audience and dates. You can type it, dictate it, or let the AI draft it.' },
    { s: 'New', find: ['Generate plan', 'button'], title: 'Build the plan',
      say: 'Then press Generate plan. In under a minute the AI writes a complete plan, week by week.' },
    { s: 'Plan', find: ['Content calendar', 'section'], title: 'Your plan',
      say: 'Here is the finished plan. Each coloured bar is a post on a channel: pink for Instagram, blue for LinkedIn, orange for blog, green for email.' },
    { s: 'Plan', find: ['Moments in this campaign', 'section'], title: 'Festivals in your plan',
      say: 'Festivals that fall inside your campaign are listed here. Press Add content on any of them and a post is added to that day.' },
    { s: 'Plan', find: ['Refine with AI', 'section'], title: 'Refine with AI',
      say: 'Want changes? Type them in plain words, for example, make week two more festive, and the AI updates the plan while keeping approved posts untouched.' },
    { s: 'Score', find: ['Rubric breakdown', 'section'], title: 'Readiness score',
      say: 'The readiness score checks the plan like a senior strategist would, and gives it a score out of one hundred. Each quick fix below raises the score before you launch.' },
    { s: 'Studio', find: ['Copy variants', 'section'], title: 'Posts and approvals',
      say: 'Each post has a few copy options to choose from, a preview for every channel, and an approval step, so nothing goes out without a reviewer saying yes.' },
    { s: 'Publish', find: ['Channels', 'section'], title: 'Publish everywhere',
      say: 'The publish hub prepares every approved post in the exact size and length each channel needs: Instagram, YouTube, LinkedIn, X, email and more. Post automatically, or download a ready folder.' },
    { s: 'Budget', find: ['Budget allocator', 'section'], title: 'Budget and returns',
      say: 'Finally, the budget allocator splits your money across channels and weeks, and below it you can track spend, cost per lead and return for each channel.' },
    { s: 'Main', find: ['Campaigns', 'section'], title: 'That is the journey',
      say: 'That is the whole journey: brief, plan, review, publish and track. Explore any screen from the menu, or create your account to plan your own campaign. Thank you for watching.' }
  ];
  var i = 0, on = false, paused = false, muted = false, timer = null, voice = null;
  var box, launch;
  var synth = window.speechSynthesis || null;

  function pickVoice() {
    if (!synth) return null;
    var vs = synth.getVoices() || [];
    return vs.find(function (v) { return /en-IN/i.test(v.lang); }) || vs.find(function (v) { return /^en/i.test(v.lang); }) || null;
  }
  if (synth && 'onvoiceschanged' in synth) synth.onvoiceschanged = function () { voice = pickVoice(); };

  function el(tag, attrs, text) { var e = document.createElement(tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; return e; }

  function build() {
    box = el('div', { id: 'tour', role: 'dialog', 'aria-label': 'Guided tour', 'aria-live': 'polite' });
    box.hidden = true;
    box.innerHTML = '<div class="t-top"><span class="t-dot"></span><span class="t-step"></span><button type="button" class="t-x" data-a="end" aria-label="End tour">End tour</button></div>' +
      '<h2 class="t-title"></h2><p class="t-text"></p><div class="t-bar"><div></div></div>' +
      '<div class="t-ctl"><button type="button" data-a="back">Back</button><button type="button" data-a="pause">Pause</button><button type="button" data-a="mute">Mute</button><button type="button" class="pri" data-a="next">Next</button></div>';
    box.addEventListener('click', function (e) {
      var a = e.target.closest('button[data-a]'); if (!a) return;
      var act = a.getAttribute('data-a');
      if (act === 'next') go(i + 1);
      else if (act === 'back') go(i - 1);
      else if (act === 'pause') togglePause();
      else if (act === 'mute') toggleMute();
      else if (act === 'end') end();
    });
    document.body.appendChild(box);
    launch = el('button', { id: 'tour-launch', type: 'button' }, '▶ Guided tour');
    launch.hidden = true;
    launch.addEventListener('click', function () { start(); });
    document.body.appendChild(launch);
  }

  function clearHL() { var o = document.querySelectorAll('.tour-hl'); for (var k = 0; k < o.length; k++) o[k].classList.remove('tour-hl'); }

  function findTarget(spec) {
    var needle = spec[0], up = spec[1];
    var all = document.querySelectorAll('#stage *'), best = null;
    for (var k = 0; k < all.length; k++) {
      var n = all[k];
      if (n.children.length > 3) continue;
      var t = (n.textContent || '').trim();
      if (t.indexOf(needle) === 0 && (!best || t.length < best.textContent.trim().length)) best = n;
    }
    if (!best) return null;
    return (up && best.closest(up)) || best;
  }

  function highlight() {
    clearHL();
    if (!on) return;
    var t = findTarget(STEPS[i].find);
    if (t) { t.classList.add('tour-hl'); t.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }

  function stopVoice() { if (synth) synth.cancel(); clearTimeout(timer); }

  function speak() {
    stopVoice();
    var dot = box.querySelector('.t-dot');
    var text = STEPS[i].say;
    var after = function () { dot.classList.remove('talk'); if (on && !paused) timer = setTimeout(function () { if (i < STEPS.length - 1) go(i + 1); }, 1400); };
    if (paused) return;
    if (synth && !muted) {
      var u = new SpeechSynthesisUtterance(text);
      voice = voice || pickVoice();
      if (voice) u.voice = voice;
      u.lang = voice ? voice.lang : 'en-IN';
      u.rate = 0.98;
      u.onstart = function () { dot.classList.add('talk'); };
      u.onend = after;
      u.onerror = function () { dot.classList.remove('talk'); timer = setTimeout(after, text.split(' ').length * 380); };
      synth.speak(u);
    } else {
      timer = setTimeout(after, Math.max(4000, text.split(' ').length * 380));
    }
  }

  function render() {
    box.querySelector('.t-step').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    box.querySelector('.t-title').textContent = STEPS[i].title;
    box.querySelector('.t-text').textContent = STEPS[i].say;
    box.querySelector('.t-bar div').style.width = ((i + 1) / STEPS.length * 100) + '%';
    box.querySelector('[data-a="back"]').disabled = i === 0;
    box.querySelector('[data-a="next"]').textContent = i === STEPS.length - 1 ? 'Finish' : 'Next';
    box.querySelector('[data-a="pause"]').textContent = paused ? 'Resume' : 'Pause';
    box.querySelector('[data-a="mute"]').textContent = muted ? 'Unmute' : 'Mute';
  }

  function go(n) {
    if (n >= STEPS.length) { end(); return; }
    if (n < 0) n = 0;
    i = n;
    render();
    stopVoice();
    var target = STEPS[i].s;
    if (App.current() !== target) App.open(target);
    setTimeout(function () { highlight(); speak(); }, 350);
  }

  function togglePause() { paused = !paused; if (paused) stopVoice(); else speak(); render(); }
  function toggleMute() { muted = !muted; if (muted && synth) synth.cancel(); render(); if (!paused && muted) speak(); if (!muted && !paused) speak(); }

  function start() {
    if (!box) build();
    on = true; paused = false; box.hidden = false; launch.hidden = true;
    go(0);
  }
  function end() {
    on = false; stopVoice(); clearHL();
    if (box) box.hidden = true;
    syncLaunch();
  }
  function syncLaunch() {
    if (!launch) return;
    var inApp = !!document.querySelector('#stage .app');
    launch.hidden = on || !inApp;
  }

  return {
    start: start, end: end,
    active: function () { return on; },
    onPaint: function () {
      if (!box) build();
      if (on) highlight();
      syncLaunch();
    }
  };
})();

App.start();
</script>
