<title>CampaignForge Pro</title>
<meta name="description" content="Plan, publish and track every marketing campaign: AI plans shaped by your Company DNA and the moments your customers celebrate, ready-to-post content for ten channels, and budget tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--ground:#14161c;--ink:#eceef2;--muted:#a3a9b5;--line:#2a2e38;--accent:#f2a93b}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow-x:hidden}
#stage{max-width:1440px;margin:0 auto;background:var(--ground)}
#stage > :first-child{width:100% !important;height:auto !important;box-sizing:border-box}
#err{padding:40px 16px;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* App screens: tablet and phone layout */
@media (max-width:1199px){
  #stage .app{flex-direction:column}
  #stage .app > nav{width:100% !important;flex-direction:row !important;align-items:center;overflow-x:auto;padding:10px 12px !important;gap:4px !important;border-right:0 !important;border-bottom:1px solid #262a33;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  #stage .app > nav > div:first-child{padding:0 8px 0 2px !important;flex-shrink:0}
  #stage .app > nav > div:first-child .disp{display:none}
  #stage .app > nav .eyebrow, #stage .app > nav > div[style*="height: 1px"], #stage .app > nav > div[style*="flex-grow"]{display:none !important}
  #stage .app > nav .nav{white-space:nowrap;flex-shrink:0;min-height:40px}
  #stage .app > nav .num{display:none}
  #stage .app > nav > .panel{flex-shrink:0;white-space:nowrap;padding:6px 12px !important}
  #stage .app > nav > .panel br{display:none}
  #stage .app > main{padding:20px 16px 40px !important;min-width:0;flex-wrap:wrap}
  #stage .app main *{max-width:100%;min-width:0;box-sizing:border-box}
  #stage .app main > aside{width:100% !important}
  #stage .app .rg1{grid-template-columns:1fr !important}
  #stage .app .rg{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  #stage .app table{display:block;overflow-x:auto;white-space:nowrap}
  #stage .app .scrollx{overflow-x:auto}
  #stage .app .gantt{min-width:880px}
  #stage .app section:has(> .gantt){overflow-x:auto}
  #stage .app header{flex-wrap:wrap;gap:12px}
  #stage .app .paper{padding:24px 20px !important}
}
@media (max-width:699px){
  #stage .app .rg{grid-template-columns:1fr !important}
  #stage .app .rg4{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  #stage .app main [style*="display: flex"]{flex-wrap:wrap}
  #stage .app h1{font-size:26px !important}
  #stage .app main .disp[style*="font-size: 30px"], #stage .app main .disp[style*="font-size: 26px"]{font-size:22px !important}
}
/* Voice-guided tour */
.tour-hl{outline:3px solid #f2a93b !important;outline-offset:4px;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,9,12,.55) !important;position:relative;z-index:40;transition:outline-color .2s}
#tour{position:fixed;z-index:60;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:380px;max-width:calc(100vw - 32px);background:#1b1e26;border:1px solid #3a3f4c;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.5);padding:18px;color:#eceef2;font-family:'DM Sans',system-ui,sans-serif}
#tour[hidden]{display:none}
#tour .t-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#tour .t-dot{width:10px;height:10px;border-radius:50%;background:#5ee0c9;flex-shrink:0}
#tour .t-dot.talk{animation:tpulse 1s ease-in-out infinite}
@keyframes tpulse{50%{opacity:.3;transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){#tour .t-dot.talk{animation:none}}
#tour .t-step{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#a3a9b5}
#tour .t-title{font:600 17px 'Space Grotesk',sans-serif;margin:0 0 6px}
#tour .t-text{font-size:14px;line-height:1.55;color:#dfe2e8;margin:0;max-height:34vh;overflow:auto}
#tour .t-bar{height:4px;border-radius:2px;background:#2a2e38;margin:12px 0}
#tour .t-bar div{height:4px;border-radius:2px;background:#f2a93b;transition:width .3s}
#tour .t-ctl{display:flex;gap:6px;flex-wrap:wrap}
#tour button{min-height:40px;padding:0 12px;border-radius:8px;border:1px solid #343945;background:#1f232c;color:#eceef2;font:600 13px 'DM Sans',sans-serif;cursor:pointer}
#tour button.pri{background:#f2a93b;border-color:#f2a93b;color:#1a1305;margin-left:auto}
#tour .t-x{margin-left:auto;min-height:32px;padding:0 10px;background:transparent;border:0;color:#a3a9b5}
#tour-launch{position:fixed;z-index:55;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #f2a93b;background:#221b10;color:#f2a93b;font:600 14px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#tour-launch[hidden]{display:none}
@media (max-width:699px){#tour{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;padding:14px}#tour .t-text{max-height:24vh}}
</style>
<style id="screen-css"></style>
<div id="stage" aria-live="polite"></div>
<script>
var SCREENS = /*SCREENS*/;
var DC = {};
function DCLogic(props) { this.props = props || {}; this.state = {}; }
DCLogic.prototype.setState = function (p) {
  var next = typeof p === 'function' ? p(this.state, this.props) : p;
  this.state = Object.assign({}, this.state, next);
  App.schedule();
};
DCLogic.prototype.forceUpdate = function () { App.schedule(); };

/* Prototype sign-in: kept in this browser only. */
var CFP = (function () {
  var KEY = 'cfp.user', mem = null;
  return {
    user: function () {
      if (mem) return mem;
      try { var raw = localStorage.getItem(KEY); if (raw) mem = JSON.parse(raw); } catch (e) {}
      return mem;
    },
    signIn: function (u) { mem = u; try { localStorage.setItem(KEY, JSON.stringify(u)); } catch (e) {} },
    signOut: function () { mem = null; try { localStorage.removeItem(KEY); } catch (e) {} }
  };
})();
</script>

<script>
var App = (function () {
  var stage = document.getElementById('stage');
  var cssEl = document.getElementById('screen-css');
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  var SVG = 'http://www.w3.org/2000/svg';
  var PUBLIC = { Home: 1, Auth: 1 };
  var parsed = {}, current = null, inst = null, pending = false;

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope[parts[0]];
    for (var i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
    return v;
  }
  function show(v) { return v == null || v === false ? '' : String(v); }
  function interp(s, scope) { return s.replace(HOLE, function (m, p) { return show(lookup(p, scope)); }); }

  function render(nodes, scope, out) {
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.nodeType === 3) { out.appendChild(document.createTextNode(interp(n.nodeValue, scope))); continue; }
      if (n.nodeType !== 1) continue;
      if (n.tagName === 'TEMPLATE' && n.hasAttribute('data-sc-for')) {
        var m = WHOLE.exec(n.getAttribute('list') || ''), list = m ? lookup(m[1], scope) : null;
        var as = n.getAttribute('as') || 'item';
        (list || []).forEach(function (item, idx) {
          var s = Object.create(scope); s[as] = item; s.$index = idx;
          render(n.content.childNodes, s, out);
        });
        continue;
      }
      if (n.tagName === 'TEMPLATE' && n.hasAttribute('data-sc-if')) {
        var c = WHOLE.exec(n.getAttribute('value') || '');
        if (c && lookup(c[1], scope)) render(n.content.childNodes, scope, out);
        continue;
      }
      var el = n.namespaceURI === SVG ? document.createElementNS(SVG, n.localName) : document.createElement(n.localName);
      for (var a = 0; a < n.attributes.length; a++) {
        var name = n.attributes[a].name, val = n.attributes[a].value;
        if (name.indexOf('hint-') === 0) continue;
        var w = WHOLE.exec(val);
        if (name.indexOf('on') === 0 && w) {
          var fn = lookup(w[1], scope);
          if (typeof fn === 'function') el.addEventListener(name.slice(2), fn);
          continue;
        }
        el.setAttribute(name, interp(val, scope));
      }
      render((n.content || n).childNodes, scope, el);
      if (el.tagName === 'TEXTAREA') el.value = el.textContent;
      out.appendChild(el);
    }
  }

  function template(name) {
    if (!parsed[name]) {
      var doc = new DOMParser().parseFromString('<body>' + SCREENS[name].html + '</body>', 'text/html');
      parsed[name] = doc.body;
    }
    return parsed[name];
  }

  /* Tag layout grids so the responsive CSS can restack them without touching row-level grids. */
  function tagGrids(root) {
    var els = root.querySelectorAll('[style*="grid-template-columns"]');
    for (var i = 0; i < els.length; i++) {
      var t = els[i].style.gridTemplateColumns || '';
      var rep = /repeat\((\d+)/.exec(t), count = rep ? +rep[1] : 0;
      if (count >= 7) { if (count > 7 && els[i].parentElement) els[i].parentElement.classList.add('scrollx'); continue; }
      var px = (t.match(/(\d+)px/g) || []).map(function (s) { return parseInt(s, 10); }).filter(function (p) { return p > 0; });
      var big = px.some(function (p) { return p >= 240; });
      if (big) els[i].classList.add('rg1');
      else if (!px.length) { els[i].classList.add('rg'); if ((count || (t.match(/fr/g) || []).length) >= 4) els[i].classList.add('rg4'); }
    }
  }

  function paint() {
    pending = false;
    if (!inst) return;
    var y = window.scrollY;
    var user = CFP.user();
    var base = { $userName: user ? user.name : 'Guest', $user: user || {} };
    var scope = Object.assign(Object.create(base), inst.renderVals() || {});
    var frag = document.createDocumentFragment();
    render(template(current).childNodes, scope, frag);
    stage.replaceChildren(frag);
    var root = stage.firstElementChild;
    if (root) {
      root.style.minHeight = window.innerHeight + 'px';
      if (root.querySelector(':scope > nav')) root.classList.add('app');
      tagGrids(root);
    }
    window.scrollTo(0, y);
    if (window.Tour) Tour.onPaint();
  }

  function go(name, push) {
    if (name === 'Signout') { CFP.signOut(); name = 'Home'; push = true; }
    if (!SCREENS[name]) name = 'Home';
    if (!PUBLIC[name] && !CFP.user()) name = 'Auth';
    if (name === 'Auth' && CFP.user()) name = 'Main';
    if (inst && inst.componentWillUnmount) inst.componentWillUnmount();
    current = name;
    cssEl.textContent = SCREENS[name].css;
    document.title = name === 'Home' ? 'CampaignForge Pro' : SCREENS[name].title + ' · CampaignForge Pro';
    inst = new DC[name]({});
    if (push && location.hash !== '#' + name) {
      try { history.pushState(null, '', '#' + name); } catch (e) { location.hash = name; }
    } else if (location.hash && location.hash !== '#' + name) {
      try { history.replaceState(null, '', '#' + name); } catch (e) {}
    }
    paint();
    window.scrollTo(0, 0);
    if (inst.componentDidMount) inst.componentDidMount();
    if (window.CFP_TOUR_PENDING && window.Tour && name !== 'Home' && name !== 'Auth') { window.CFP_TOUR_PENDING = false; setTimeout(function () { Tour.start(); }, 300); }
  }

  stage.addEventListener('click', function (e) {
    var tb = e.target.closest('button');
    if (tb && /Explore demo campaign/.test(tb.textContent) && window.Tour) { Tour.start(); return; }
    var a = e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href');
    var m = /^\/?([A-Za-z0-9_-]+)\.dc\.html$/.exec(href);
    if (m) { e.preventDefault(); go(m[1], true); return; }
    if (href.charAt(0) === '#' && href.length > 1) {
      var target = document.getElementById(href.slice(1));
      if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }
  });
  window.addEventListener('popstate', function () { go(location.hash.slice(1) || 'Home', false); });
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (h && h !== current && (SCREENS[h] || h === 'Signout')) go(h, false); });

  return {
    current: function () { return current; },
    open: function (name) { go(name, true); },
    schedule: function () { if (!pending) { pending = true; requestAnimationFrame(paint); } },
    start: function () {
      try { go(location.hash.slice(1) || 'Home', false); }
      catch (err) { stage.innerHTML = '<p id="err">This page could not load. Reload to try again.</p>'; console.error(err); }
    }
  };
})();
</script>
<script>
/* Voice-guided walkthrough of the sample campaign. Uses the browser's built-in speech; captions always shown. */
var Tour = (function () {
  var STEPS = [
    { s: 'Main', find: ['Campaign dashboard', 'header'], title: 'Welcome',
      say: 'Welcome to CampaignForge Pro. I will walk you through a sample campaign for a sweet shop called Kesar and Company, getting ready for Diwali. You can pause, go back, or mute me at any time.' },
    { s: 'Main', find: ['Active campaigns', 'section'], title: 'Your dashboard',
      say: 'This is your campaign dashboard. These tiles show how many campaigns are running, the total budget, how much has been spent, and the revenue you expect.' },
    { s: 'Main', find: ['Pacing alert', 'section'], title: 'Early warnings',
      say: 'When a campaign is spending faster than planned, an alert like this appears, so you can fix it before the money runs out.' },
    { s: 'Brand', find: ['Brand voice', 'section'], title: 'Company DNA',
      say: 'Before planning anything, you describe your brand once here: how you sound, words to use, words to avoid, and the facts the AI is allowed to use. Every plan and post follows these rules.' },
    { s: 'Dates', find: ['Target markets', 'section'], title: 'Moments calendar',
      say: 'Pick the markets you sell in. The app then lists festivals, holidays and sale days for those markets, and tells you how early to start posting for each one.' },
    { s: 'New', find: ['Choose a campaign type', 'div'], title: 'Start a campaign',
      say: 'To start a campaign, choose a type such as lead generation or product launch, and write a short brief about your business, audience and dates. You can type it, dictate it, or let the AI draft it.' },
    { s: 'New', find: ['Generate plan', 'button'], title: 'Build the plan',
      say: 'Then press Generate plan. In under a minute the AI writes a complete plan, week by week.' },
    { s: 'Plan', find: ['Content calendar', 'section'], title: 'Your plan',
      say: 'Here is the finished plan. Each coloured bar is a post on a channel: pink for Instagram, blue for LinkedIn, orange for blog, green for email.' },
    { s: 'Plan', find: ['Moments in this campaign', 'section'], title: 'Festivals in your plan',
      say: 'Festivals that fall inside your campaign are listed here. Press Add content on any of them and a post is added to that day.' },
    { s: 'Plan', find: ['Refine with AI', 'section'], title: 'Refine with AI',
      say: 'Want changes? Type them in plain words, for example, make week two more festive, and the AI updates the plan while keeping approved posts untouched.' },
    { s: 'Score', find: ['Rubric breakdown', 'section'], title: 'Readiness score',
      say: 'The readiness score checks the plan like a senior strategist would, and gives it a score out of one hundred. Each quick fix below raises the score before you launch.' },
    { s: 'Studio', find: ['Copy variants', 'section'], title: 'Posts and approvals',
      say: 'Each post has a few copy options to choose from, a preview for every channel, and an approval step, so nothing goes out without a reviewer saying yes.' },
    { s: 'Publish', find: ['Channels', 'section'], title: 'Publish everywhere',
      say: 'The publish hub prepares every approved post in the exact size and length each channel needs: Instagram, YouTube, LinkedIn, X, email and more. Post automatically, or download a ready folder.' },
    { s: 'Budget', find: ['Budget allocator', 'section'], title: 'Budget and returns',
      say: 'Finally, the budget allocator splits your money across channels and weeks, and below it you can track spend, cost per lead and return for each channel.' },
    { s: 'Main', find: ['Campaigns', 'section'], title: 'That is the journey',
      say: 'That is the whole journey: brief, plan, review, publish and track. Explore any screen from the menu, or create your account to plan your own campaign. Thank you for watching.' }
  ];
  var i = 0, on = false, paused = false, muted = false, timer = null, voice = null;
  var box, launch;
  var synth = window.speechSynthesis || null;

  function pickVoice() {
    if (!synth) return null;
    var vs = synth.getVoices() || [];
    return vs.find(function (v) { return /en-IN/i.test(v.lang); }) || vs.find(function (v) { return /^en/i.test(v.lang); }) || null;
  }
  if (synth && 'onvoiceschanged' in synth) synth.onvoiceschanged = function () { voice = pickVoice(); };

  function el(tag, attrs, text) { var e = document.createElement(tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; return e; }

  function build() {
    box = el('div', { id: 'tour', role: 'dialog', 'aria-label': 'Guided tour', 'aria-live': 'polite' });
    box.hidden = true;
    box.innerHTML = '<div class="t-top"><span class="t-dot"></span><span class="t-step"></span><button type="button" class="t-x" data-a="end" aria-label="End tour">End tour</button></div>' +
      '<h2 class="t-title"></h2><p class="t-text"></p><div class="t-bar"><div></div></div>' +
      '<div class="t-ctl"><button type="button" data-a="back">Back</button><button type="button" data-a="pause">Pause</button><button type="button" data-a="mute">Mute</button><button type="button" class="pri" data-a="next">Next</button></div>';
    box.addEventListener('click', function (e) {
      var a = e.target.closest('button[data-a]'); if (!a) return;
      var act = a.getAttribute('data-a');
      if (act === 'next') go(i + 1);
      else if (act === 'back') go(i - 1);
      else if (act === 'pause') togglePause();
      else if (act === 'mute') toggleMute();
      else if (act === 'end') end();
    });
    document.body.appendChild(box);
    launch = el('button', { id: 'tour-launch', type: 'button' }, '▶ Guided tour');
    launch.hidden = true;
    launch.addEventListener('click', function () { start(); });
    document.body.appendChild(launch);
  }

  function clearHL() { var o = document.querySelectorAll('.tour-hl'); for (var k = 0; k < o.length; k++) o[k].classList.remove('tour-hl'); }

  function findTarget(spec) {
    var needle = spec[0], up = spec[1];
    var all = document.querySelectorAll('#stage *'), best = null;
    for (var k = 0; k < all.length; k++) {
      var n = all[k];
      if (n.children.length > 3) continue;
      var t = (n.textContent || '').trim();
      if (t.indexOf(needle) === 0 && (!best || t.length < best.textContent.trim().length)) best = n;
    }
    if (!best) return null;
    return (up && best.closest(up)) || best;
  }

  function highlight() {
    clearHL();
    if (!on) return;
    var t = findTarget(STEPS[i].find);
    if (t) { t.classList.add('tour-hl'); t.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }

  function stopVoice() { if (synth) synth.cancel(); clearTimeout(timer); }

  function speak() {
    stopVoice();
    var dot = box.querySelector('.t-dot');
    var text = STEPS[i].say;
    var after = function () { dot.classList.remove('talk'); if (on && !paused) timer = setTimeout(function () { if (i < STEPS.length - 1) go(i + 1); }, 1400); };
    if (paused) return;
    if (synth && !muted) {
      var u = new SpeechSynthesisUtterance(text);
      voice = voice || pickVoice();
      if (voice) u.voice = voice;
      u.lang = voice ? voice.lang : 'en-IN';
      u.rate = 0.98;
      u.onstart = function () { dot.classList.add('talk'); };
      u.onend = after;
      u.onerror = function () { dot.classList.remove('talk'); timer = setTimeout(after, text.split(' ').length * 380); };
      synth.speak(u);
    } else {
      timer = setTimeout(after, Math.max(4000, text.split(' ').length * 380));
    }
  }

  function render() {
    box.querySelector('.t-step').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    box.querySelector('.t-title').textContent = STEPS[i].title;
    box.querySelector('.t-text').textContent = STEPS[i].say;
    box.querySelector('.t-bar div').style.width = ((i + 1) / STEPS.length * 100) + '%';
    box.querySelector('[data-a="back"]').disabled = i === 0;
    box.querySelector('[data-a="next"]').textContent = i === STEPS.length - 1 ? 'Finish' : 'Next';
    box.querySelector('[data-a="pause"]').textContent = paused ? 'Resume' : 'Pause';
    box.querySelector('[data-a="mute"]').textContent = muted ? 'Unmute' : 'Mute';
  }

  function go(n) {
    if (n >= STEPS.length) { end(); return; }
    if (n < 0) n = 0;
    i = n;
    render();
    stopVoice();
    var target = STEPS[i].s;
    if (App.current() !== target) App.open(target);
    setTimeout(function () { highlight(); speak(); }, 350);
  }

  function togglePause() { paused = !paused; if (paused) stopVoice(); else speak(); render(); }
  function toggleMute() { muted = !muted; if (muted && synth) synth.cancel(); render(); if (!paused && muted) speak(); if (!muted && !paused) speak(); }

  function start() {
    if (!box) build();
    on = true; paused = false; box.hidden = false; launch.hidden = true;
    go(0);
  }
  function end() {
    on = false; stopVoice(); clearHL();
    if (box) box.hidden = true;
    syncLaunch();
  }
  function syncLaunch() {
    if (!launch) return;
    var inApp = !!document.querySelector('#stage .app');
    launch.hidden = on || !inApp;
  }

  return {
    start: start, end: end,
    active: function () { return on; },
    onPaint: function () {
      if (!box) build();
      if (on) highlight();
      syncLaunch();
    }
  };
})();

App.start();
</script>
